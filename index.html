<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Acil Kura Odası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#f6f7f9; --panel:#fff; --line:#e3e7ec; --line2:#cfd6de;
  --ink:#111827; --mut:#5b6573; --dim:#8a94a3;
  --acc:#b91c1c; --acc2:#991b1b; --acc-soft:#fdecec;
  --ok:#15803d; --ok-soft:#e8f6ed; --bad:#b91c1c; --warn:#b45309; --warn-soft:#fdf3e2;
  --r:16px; --rs:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto;padding:16px 16px 4px}
.brand{font-weight:800;letter-spacing:.12em;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{white-space:nowrap;flex:none;font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;letter-spacing:.1em}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(48px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
h1{font-size:25px;line-height:1.25;letter-spacing:-.01em;margin-top:16px}
h2{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;margin-bottom:10px}
.sub{color:var(--mut);font-size:14.5px;line-height:1.6;margin-top:8px}
.small{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--panel);
  color:var(--ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--acc);border-color:var(--acc2);color:#fff}
.btn.wa{background:#1fa855;border-color:#178a45;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}
.mini{display:inline-block;width:auto;padding:7px 11px;font-size:13px;border-radius:10px}
input[type=text]{width:100%;padding:12px;border-radius:var(--rs);border:1px solid var(--line2);background:#fff;color:var(--ink);font:inherit;font-size:16px;outline:none}
input[type=text]:focus{border-color:var(--acc)}
input.code{font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:20px}
.namegrid{display:grid;gap:8px;margin-top:10px}
.namegrid label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);font-weight:700}
.namegrid label span{width:16px;text-align:right}
.mono{font-family:var(--mono);word-break:break-all}
.seal{border:1px dashed #d8a7a7;background:#fff8f8;border-radius:var(--r);padding:14px 16px;margin-top:14px}
.seal .mono{font-size:12px;color:#7f1d1d;line-height:1.6}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;font-weight:600;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sira{width:22px;color:var(--dim);font-weight:700;font-size:13px;flex:none}
.stat{font-size:12.5px;color:var(--dim);flex:none}
.stat.ok{color:var(--ok);font-weight:700}
.stat.now{color:var(--acc);font-weight:800;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.35}}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;border-radius:50%;
  background:var(--acc);color:#fff;font-weight:800;font-size:16px;flex:none}
.banner{border:1px solid var(--line2);border-left:5px solid var(--acc);background:var(--panel);border-radius:var(--rs);
  padding:14px 16px;margin-top:14px;font-size:16px;font-weight:700;line-height:1.45}
.banner.you{border-left-color:var(--ok);background:var(--ok-soft)}
.banner.wait{border-left-color:var(--warn);background:var(--warn-soft)}
.torba{margin-top:14px;background:radial-gradient(120% 90% at 50% 0%,#fff 0%,#f3eee6 70%);border:2px solid #d9c9b0;
  border-radius:28px 28px 120px 120px;padding:22px 18px 40px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.top{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#f4d2d2 18%,#c83737 60%,#8f1d1d 100%);
  color:rgba(255,255,255,.9);font-size:20px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .12s}
.top:active{transform:scale(.9)}
.top:disabled{opacity:.5}
.spot{text-align:center;padding:20px 12px;margin-top:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);animation:pop .45s ease-out}
.spot .big{font-size:74px;font-weight:800;color:var(--acc);line-height:1.05}
.spot .who{font-size:17px;font-weight:700;margin-top:4px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.res .row{padding:12px 2px}
.res .row.me{background:var(--ok-soft);border-radius:10px;padding-left:10px;padding-right:10px}
.metag{font-size:10.5px;color:var(--ok);font-weight:800;letter-spacing:.1em}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-top:12px;overflow:hidden}
summary{padding:14px 16px;font-weight:700;font-size:14.5px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--mut)}
details[open] summary::before{content:"▾ "}
.dbody{padding:2px 16px 16px;font-size:13.5px;color:var(--mut);line-height:1.6}
.dbody .mono{font-size:11.5px;background:#f8f9fb;border:1px solid var(--line);border-radius:8px;padding:8px;display:block;margin:6px 0;color:#374151;white-space:pre-wrap}
.dbody h3{font-size:13.5px;color:var(--ink);margin-top:14px}
.chk{font-weight:800} .chk.ok{color:var(--ok)} .chk.bad{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:#111827;color:#fff;
  border-radius:12px;padding:11px 16px;font-size:14px;max-width:90vw;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.divider{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;letter-spacing:.16em;margin:18px 0 8px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.center{text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="brand">🎲 ACİL STAJI · NUMARA KURASI</div>
  <div id="chip" class="chip hidden"></div>
</header>
<main id="app"></main>
<div id="toast" class="toast hidden" role="status"></div>
<noscript><main><div class="card">Bu sayfa için JavaScript gerekli.</div></main></noscript>

<script>
(() => {
"use strict";
// Bazı mobil operatörler *.vercel.app / *.netlify.app bağlantısını kesiyor. Aynı odalara giden birkaç yol:
// kendi kökeninde /api/room varsa (Vercel, yerel) önce o; GitHub Pages aynasında yalnız uzak uçlar.
const AYNI_KOKEN = !location.hostname.endsWith("github.io");
const API_YOLLARI = [
  ...(AYNI_KOKEN ? ["/api/room"] : []),
  "https://acil-kura-api-2026.netlify.app/api/room",
  "https://acil-kura.vercel.app/api/room",
].filter((u, i, a) => a.indexOf(u) === i && !(u.startsWith(location.origin) && i > 0));
let apiSira = Number(sessionStorage.getItem("acilKura.api") || 0) % API_YOLLARI.length;

// Ağ hatasında (bağlantı kesildi) sıradaki yolu dene; çalışanı oturum boyunca hatırla.
// HTTP hatası (400/404) ağ sorunu değildir, aynen döner.
async function istek(sorgu, ayar) {
  let son;
  for (let i = 0; i < API_YOLLARI.length; i += 1) {
    const j = (apiSira + i) % API_YOLLARI.length;
    try {
      const r = await fetch(API_YOLLARI[j] + sorgu, ayar);
      if (j !== apiSira) { apiSira = j; sessionStorage.setItem("acilKura.api", String(j)); }
      return r;
    } catch (e) { son = e; }
  }
  throw son;
}
const KISI = 9;
const FAKTORIYEL = [1, 1, 2, 6, 24, 120, 720, 5040, 40320, 362880];
const AsAMA = { lobi: "Lobi", cekim: "Çekim", bitti: "Sonuç" };
const app = document.getElementById("app");
const chipEl = document.getElementById("chip");
const toastEl = document.getElementById("toast");

const S = { kod: null, oda: null, mesgul: false, zamanlayici: null, gorulenCekim: null, spot: null, kontrol: null };

const LS = {
  cihaz() {
    let c = localStorage.getItem("acilKura.cihaz");
    if (!c) {
      c = crypto.randomUUID ? crypto.randomUUID()
        : [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");
      localStorage.setItem("acilKura.cihaz", c);
    }
    return c;
  },
  org: (k) => localStorage.getItem(`acilKura.${k}.org`) || "",
  setOrg: (k, v) => localStorage.setItem(`acilKura.${k}.org`, v),
  son: () => localStorage.getItem("acilKura.son"),
  setSon: (k) => localStorage.setItem("acilKura.son", k),
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const katilimLinki = () => `${location.origin}${location.pathname}?oda=${S.kod}`;
const yoneticiLinki = () => `${katilimLinki()}#yonetici=${LS.org(S.kod)}`;

let toastZaman = null;
function toast(m) {
  toastEl.textContent = m;
  toastEl.classList.remove("hidden");
  clearTimeout(toastZaman);
  toastZaman = setTimeout(() => toastEl.classList.add("hidden"), 3400);
}
async function kopyala(metin, tamam) {
  try { await navigator.clipboard.writeText(metin); toast(tamam); }
  catch { prompt("Kopyalayın:", metin); }
}

async function sha256(metin) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(metin));
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
const bas16 = (h) => BigInt(`0x${h.slice(0, 16)}`);
function permutasyon(idx, n) {
  const havuz = [...Array(n).keys()], out = [];
  for (let i = n, kalan = idx; i >= 1; i -= 1) {
    const f = FAKTORIYEL[i - 1];
    out.push(havuz.splice(Math.floor(kalan / f), 1)[0]);
    kalan %= f;
  }
  return out;
}

async function apiPost(govde) {
  const r = await istek("", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(govde) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Bağlantı hatası, tekrar deneyin.");
  return d;
}
async function apiOku(kod) {
  const r = await istek(`?${new URLSearchParams({ code: kod, token: LS.cihaz(), org: LS.org(kod) })}`);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Bağlantı hatası, tekrar deneyin.");
  return d.room;
}

function odaAl(oda) {
  const onceki = S.oda;
  S.oda = oda;
  if (onceki && oda.cekimler.length > onceki.cekimler.length) {
    const c = oda.cekimler[oda.cekimler.length - 1];
    S.spot = { ad: oda.isimler[c.kisi].ad, numara: c.numara, sen: c.kisi === oda.sen, bitis: Date.now() + 3500 };
    setTimeout(() => { if (S.spot && Date.now() >= S.spot.bitis) { S.spot = null; ciz(); } }, 3600);
  }
  if (oda.asama === "bitti") durdur();
  if (JSON.stringify(onceki) !== JSON.stringify(oda)) ciz();
}

function durdur() { clearInterval(S.zamanlayici); S.zamanlayici = null; }
function basla() { durdur(); S.zamanlayici = setInterval(() => yenile().catch(() => {}), 1500); }
let yenileniyor = false;
async function yenile() {
  if (!S.kod || yenileniyor) return;
  yenileniyor = true;
  try { odaAl(await apiOku(S.kod)); }
  catch (e) { if (/bulunamadı/i.test(e.message)) { toast(e.message); cik(); } }
  finally { yenileniyor = false; }
}

async function odayaGir(kod) {
  kod = String(kod || "").trim().toUpperCase();
  if (!kod) return;
  let oda;
  try { oda = await apiOku(kod); } catch (e) { toast(e.message); return; }
  S.kod = kod; S.oda = null; S.kontrol = null;
  LS.setSon(kod);
  history.replaceState(null, "", `?oda=${kod}`);
  odaAl(oda);
  if (oda.asama !== "bitti") basla();
}
function cik() {
  durdur();
  S.kod = null; S.oda = null; S.spot = null;
  history.replaceState(null, "", location.pathname);
  ciz();
}

/* ---------- çizim ---------- */
function ciz() {
  const o = S.oda;
  chipEl.classList.toggle("hidden", !o);
  if (o) chipEl.innerHTML = `<b>${esc(o.kod)}</b> · ${AsAMA[o.asama]}`;
  if (!o) return anaSayfa();
  if (o.asama === "lobi") return o.sen === null ? isimSec() : lobi();
  if (o.asama === "cekim") return cekim();
  return sonuc();
}

const muhurKarti = (o) => `
  <div class="seal">
    <h2>🔏 Adalet Mührü</h2>
    <span class="mono">${esc(o.muhur)}</span>
    <p class="sub small">Bu, oda kurulurken üretilen gizli tohumun SHA-256 özeti ve artık değişemez.
    Tohum baştan mühürlü olduğu için kimse sonucu seçemez; gizli olduğu için kimse önceden bilemez.
    Kura bitince tohum açılır, herkes kontrol eder.</p>
  </div>`;

function anaSayfa() {
  document.title = "Acil Kura Odası";
  const son = LS.son();
  app.innerHTML = `
    <h1>Hangi numara kimin?<br>Torbadan sırayla çekelim.</h1>
    <p class="sub">Görev listesindeki 1–9 numaraları 9 kişiye kurayla dağıtılır. Herkes kendi telefonundan,
    sırası gelince torbadan bir top çeker. Sonuç sonradan herkesçe doğrulanabilir.</p>
    ${son ? `<button class="btn" style="margin-top:14px;text-align:left" data-is="devam">🔄 Devam eden oda: <b class="mono">${esc(son)}</b> →</button>` : ""}
    <div class="card">
      <h2>Oda kur · 9 isim</h2>
      <p class="sub small" style="margin-top:0">İsimleri yazın. Kurayı açan kişi de listede olabilir.</p>
      <div class="namegrid">
        ${Array.from({ length: KISI }, (_, i) => `<label><span>${i + 1}</span><input type="text" maxlength="30" autocomplete="off" data-isim="${i}" placeholder="İsim"></label>`).join("")}
      </div>
      <button class="btn primary" style="margin-top:14px" data-is="kur">Odayı kur</button>
      <div class="divider">VEYA KODLA KATIL</div>
      <input type="text" id="kodGir" class="code" maxlength="5" autocomplete="off" placeholder="ODA KODU" enterkeyhint="go">
      <button class="btn" style="margin-top:10px" data-is="koddanGir">Odaya katıl</button>
    </div>`;
  document.getElementById("kodGir").addEventListener("keydown", (e) => { if (e.key === "Enter") yap("koddanGir", {}); });
}

function isimSec() {
  const o = S.oda;
  document.title = "Sen kimsin? — Acil Kura";
  app.innerHTML = `
    <h1>Sen kimsin?</h1>
    <p class="sub">Kendi adına dokun. Bu telefon kurada senin yerine geçer; her isim yalnız bir telefondan alınır.</p>
    <div class="card">
      ${o.isimler.map((x, i) => `
        <div class="row">
          <span class="nm">${esc(x.ad)}</span>
          ${x.alindi ? `<span class="stat ok">✓ katıldı</span>` : `<button class="btn mini" data-is="katil" data-i="${i}">Benim →</button>`}
        </div>`).join("")}
    </div>
    ${o.yonetici ? yoneticiPaneli(o) : ""}
    ${muhurKarti(o)}`;
}

function yoneticiPaneli(o) {
  const katilan = o.isimler.filter((x) => x.alindi).length;
  return `
    <div class="card">
      <h2>Kurucu · ${katilan}/${KISI} katıldı</h2>
      <p class="sub small" style="margin-top:0">Katılım linkini gruba gönderin. Herkes kendi adını seçince kurayı başlatın.</p>
      <div class="actions">
        <button class="btn mini" data-is="linkKopyala">🔗 Linki kopyala</button>
        <button class="btn mini wa" data-is="whatsapp">WhatsApp'ta paylaş</button>
        <button class="btn mini" data-is="yoneticiKopyala">🔑 Kurucu linkimi sakla</button>
      </div>
      <p class="sub small">Kurucu linki yalnız sizin içindir. Başka telefondan da kurucu olarak devam etmenizi sağlar, paylaşmayın.</p>
      ${o.isimler.some((x) => x.alindi) ? `<div style="margin-top:10px">${o.isimler.map((x, i) => x.alindi ? `
        <div class="row"><span class="nm">${esc(x.ad)}</span>
        <button class="btn mini" data-is="birak" data-i="${i}">Yanlış alındı, bırak</button></div>` : "").join("")}</div>` : ""}
      <button class="btn primary" style="margin-top:14px" data-is="baslat" ${katilan === KISI ? "" : "disabled"}>
        ${katilan === KISI ? "🎲 Kurayı başlat" : `Herkes katılınca başlar (${katilan}/${KISI})`}
      </button>
    </div>`;
}

function lobi() {
  const o = S.oda;
  const katilan = o.isimler.filter((x) => x.alindi).length;
  document.title = `Lobi ${katilan}/${KISI} — Acil Kura`;
  app.innerHTML = `
    <h1>Yerin hazır, ${esc(o.isimler[o.sen].ad)} ✓</h1>
    <p class="sub">Herkes katılınca kurucu kurayı başlatacak. Sıra da kurayla belirlenecek; sıran gelince bu ekranda göreceksin.</p>
    <div class="card">
      <h2>Katılım · ${katilan}/${KISI}</h2>
      ${o.isimler.map((x, i) => `
        <div class="row">
          <span class="nm">${esc(x.ad)}${i === o.sen ? ` <span class="metag">SEN</span>` : ""}</span>
          <span class="stat ${x.alindi ? "ok" : ""}">${x.alindi ? "✓ katıldı" : "bekleniyor"}</span>
        </div>`).join("")}
    </div>
    ${o.yonetici ? yoneticiPaneli(o) : ""}
    ${muhurKarti(o)}`;
}

function cekim() {
  const o = S.oda;
  const k = o.cekimler.length + 1;
  const sirada = o.sira[k - 1];
  const sende = sirada === o.sen;
  document.title = sende ? "🔔 SIRA SENDE — Acil Kura" : `Çekim ${k - 1}/${KISI} — Acil Kura`;
  if (sende && S.gorulenCekim !== k) { S.gorulenCekim = k; navigator.vibrate?.([120, 60, 120]); }
  const spot = S.spot && Date.now() < S.spot.bitis ? S.spot : null;
  app.innerHTML = `
    <h1>Torbadan sırayla çekiliyor</h1>
    ${spot ? `<div class="spot"><div class="big">${spot.numara}</div>
      <div class="who">${spot.sen ? "Senin numaran" : `${esc(spot.ad)} çekti`}</div></div>` : ""}
    ${sende ? `
      <div class="banner you">🔔 Sıra sende, ${esc(o.isimler[o.sen].ad)}! Torbadan bir top seç.</div>
      <div class="torba">
        ${Array.from({ length: o.kalanSayisi }, (_, i) => `<button class="top" data-is="cek" data-i="${i}" ${S.mesgul ? "disabled" : ""}>?</button>`).join("")}
      </div>
      <p class="sub small center">Toplar birbirinin aynı. Hangi numaranın çıkacağını kimse bilmiyor.</p>`
    : `<div class="banner wait">⏳ ${esc(o.isimler[sirada].ad)} bekleniyor. Sırası onda, kendi telefonundan çekecek.
         <span class="sub small" style="display:block;margin-top:4px">Onun yerine kimse çekemez; kura onu bekler.</span></div>`}
    <div class="card">
      <h2>Çekim sırası · ${k - 1}/${KISI}</h2>
      ${o.sira.map((kisi, i) => {
        const c = o.cekimler[i];
        return `<div class="row">
          <span class="sira">${i + 1}.</span>
          <span class="nm">${esc(o.isimler[kisi].ad)}${kisi === o.sen ? ` <span class="metag">SEN</span>` : ""}</span>
          ${c ? `<span class="num">${c.numara}</span>` : `<span class="stat ${i === k - 1 ? "now" : ""}">${i === k - 1 ? "● sırada" : "bekliyor"}</span>`}
        </div>`;
      }).join("")}
    </div>
    ${o.sen === null ? `<p class="sub small center">👁 İzliyorsun. Bu telefondan isim alınmadı.</p>` : ""}
    ${muhurKarti(o)}`;
}

function sonuc() {
  const o = S.oda;
  document.title = "Sonuç — Acil Kura";
  const tablo = [...o.cekimler].sort((a, b) => a.numara - b.numara);
  const sira = o.acilis.sira;
  app.innerHTML = `
    <h1>Kura tamamlandı 🎲</h1>
    <p class="sub">Numaralar görev listesindeki 1–9 numaralarıdır.</p>
    <div class="card res">
      ${tablo.map((c) => `<div class="row ${c.kisi === o.sen ? "me" : ""}">
        <span class="num">${c.numara}</span>
        <span class="nm">${esc(o.isimler[c.kisi].ad)}${c.kisi === o.sen ? ` <span class="metag">SEN</span>` : ""}</span>
      </div>`).join("")}
    </div>
    <button class="btn wa" style="margin-top:14px" data-is="sonucKopyala">WhatsApp'a kopyala</button>
    <details open>
      <summary>🔍 Adalet kanıtı — kendin doğrula <span class="chk" id="chkOzet"></span></summary>
      <div class="dbody">
        <h3>1 · Mühür tutuyor mu? <span class="chk" id="chkMuhur">hesaplanıyor…</span></h3>
        <p>Kuradan önce ilan edilen mühür, şimdi açılan tohumun SHA-256 özeti olmalı.</p>
        <span class="mono">Mühür: ${esc(o.muhur)}\nTohum: ${esc(o.acilis.tohum)}</span>
        <h3>2 · Çekim sırası <span class="chk" id="chkSira">hesaplanıyor…</span></h3>
        <p>SHA-256(tohum + ":sira") özetinin ilk 16 hanesi 9! = 362880'e bölünür; kalan, isimlerin giriş sırasına uygulanan permütasyonun numarasıdır.</p>
        <span class="mono">Girdi: ${esc(sira.girdi)}\nSHA-256: ${esc(sira.hash)}\n0x${esc(sira.hash.slice(0, 16))} mod 362880 = ${sira.idx}\nSıra: ${o.sira.map((i) => esc(o.isimler[i].ad)).join(" → ")}</span>
        <h3>3 · Her çekim <span class="chk" id="chkCekim">hesaplanıyor…</span></h3>
        <p>Girdi = tohum : çekim no : o ana kadarki tüm top seçimleri. Özetin ilk 16 hanesi torbada kalan numara sayısına bölünür;
        kalan, küçükten büyüğe sıralı torbadaki sıradır.</p>
        ${o.cekimler.map((c) => `<span class="mono">${c.k}. ${esc(o.isimler[c.kisi].ad)} · ${c.top + 1}. topu seçti <span class="chk" id="chk${c.k}"></span>
Girdi: ${esc(c.girdi)}
SHA-256: ${esc(c.hash)}
Torba: [${c.kalan.join(", ")}] → 0x${esc(c.hash.slice(0, 16))} mod ${c.kalan.length} = ${c.indeks} → ${c.numara}</span>`).join("")}
        <p style="margin-top:10px">Bize güvenmeyin: girdileri herhangi bir "SHA-256" aracına yapıştırın, aynı özeti görün.</p>
      </div>
    </details>
    <button class="btn" style="margin-top:12px" data-is="cik">Ana ekrana dön</button>`;
  dogrula();
}

// Sunucunun söylediğini değil, tohumdan tarayıcıda yeniden hesaplananı gösterir.
async function dogrula() {
  const o = S.oda;
  const yaz = (id, ok) => { const el = document.getElementById(id); if (el) { el.textContent = ok ? "✓" : "✗ UYUŞMUYOR"; el.className = `chk ${ok ? "ok" : "bad"}`; } };
  try {
    const tohum = o.acilis.tohum;
    const muhur = (await sha256(tohum)) === o.muhur;
    const siraHash = await sha256(`${tohum}:sira`);
    const sira = permutasyon(Number(bas16(siraHash) % 362880n), KISI).join() === o.sira.join();
    let kalan = [...Array(KISI)].map((_, i) => i + 1), dokunus = [], hepsi = true;
    for (const c of o.cekimler) {
      dokunus.push(c.top);
      const hash = await sha256(`${tohum}:${c.k}:${dokunus.join(",")}`);
      const numara = kalan[Number(bas16(hash) % BigInt(kalan.length))];
      const ok = hash === c.hash && numara === c.numara && c.kisi === o.sira[c.k - 1];
      yaz(`chk${c.k}`, ok);
      hepsi &&= ok;
      kalan = kalan.filter((n) => n !== numara);
    }
    yaz("chkMuhur", muhur); yaz("chkSira", sira); yaz("chkCekim", hepsi);
    const ozet = document.getElementById("chkOzet");
    if (ozet) { const ok = muhur && sira && hepsi; ozet.textContent = ok ? "✓ hepsi doğrulandı" : "✗ uyuşmazlık var"; ozet.className = `chk ${ok ? "ok" : "bad"}`; }
  } catch {
    const el = document.getElementById("chkMuhur");
    if (el) el.textContent = "tarayıcıda hesaplanamadı, harici araçla doğrulayın";
  }
}

/* ---------- işlemler ---------- */
const isler = {
  devam() { odayaGir(LS.son()); },
  koddanGir() { odayaGir(document.getElementById("kodGir")?.value); },
  async kur() {
    const isimler = [...document.querySelectorAll("[data-isim]")].map((el) => el.value.trim());
    if (isimler.some((s) => !s)) throw new Error("9 ismin hepsini yazın.");
    const d = await apiPost({ action: "kur", isimler });
    LS.setOrg(d.room.kod, d.org);
    await odayaGir(d.room.kod);
    toast("Oda kuruldu. Linki gruba gönderin, listede adınız varsa kendinizi seçin.");
  },
  async katil(d) { odaAl((await apiPost({ action: "katil", code: S.kod, isim: Number(d.i), token: LS.cihaz() })).room); },
  async birak(d) {
    const ad = S.oda.isimler[Number(d.i)].ad;
    if (!confirm(`${ad} ismi bırakılsın mı? Doğru kişi yeniden seçebilir.`)) return;
    odaAl((await apiPost({ action: "birak", code: S.kod, isim: Number(d.i), org: LS.org(S.kod), token: LS.cihaz() })).room);
  },
  async baslat() { odaAl((await apiPost({ action: "baslat", code: S.kod, org: LS.org(S.kod), token: LS.cihaz() })).room); },
  async cek(d) {
    ciz();
    const o = S.oda;
    odaAl((await apiPost({ action: "cek", code: S.kod, token: LS.cihaz(), k: o.cekimler.length + 1, top: Number(d.i) })).room);
  },
  linkKopyala() { kopyala(katilimLinki(), "Link kopyalandı, gruba yapıştırın."); },
  yoneticiKopyala() { kopyala(yoneticiLinki(), "Kurucu linki kopyalandı. Kendinize saklayın."); },
  whatsapp() {
    const metin = `🎲 Acil stajı numara kurası başlıyor! Linke girip kendi adını seç, sıran gelince torbadan topunu çek:\n${katilimLinki()}`;
    location.href = `https://wa.me/?text=${encodeURIComponent(metin)}`;
  },
  sonucKopyala() {
    const o = S.oda;
    const metin = [
      `🎲 Acil Stajı Numara Kurası — Sonuç (oda ${o.kod})`,
      ...[...o.cekimler].sort((a, b) => a.numara - b.numara).map((c) => `${c.numara} → ${o.isimler[c.kisi].ad}`),
      "",
      `Mühür (kuradan önce): ${o.muhur}`,
      `Tohum (kuradan sonra): ${o.acilis.tohum}`,
      `Doğrulama: ${katilimLinki()}`,
    ].join("\n");
    kopyala(metin, "Sonuç kopyalandı, gruba yapıştırın.");
  },
  cik() { cik(); },
};

async function yap(ad, veri) {
  if (S.mesgul || !isler[ad]) return;
  S.mesgul = true;
  try { await isler[ad](veri); }
  catch (e) { toast(e.message || "Bir şeyler ters gitti."); await yenile(); }
  finally { S.mesgul = false; if (S.oda?.asama === "cekim") ciz(); }
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-is]");
  if (el) yap(el.dataset.is, el.dataset);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) yenile().catch(() => {}); });

const q = new URLSearchParams(location.search);
const hash = new URLSearchParams(location.hash.slice(1));
const yon = hash.get("yonetici");
if (q.get("oda") && yon) { LS.setOrg(q.get("oda").trim().toUpperCase(), yon); history.replaceState(null, "", `?oda=${q.get("oda")}`); }
// Kişisel aktarım linki: başka adreste/cihazda alınmış ismi bu tarayıcıya taşır (operatör engeli durumunda).
function cihazAktar(h) {
  const aktarilan = h.get("cihaz");
  if (!q.get("oda") || !/^[A-Za-z0-9-]{16,64}$/.test(aktarilan ?? "")) return false;
  localStorage.setItem("acilKura.cihaz", aktarilan);
  history.replaceState(null, "", `?oda=${q.get("oda")}`);
  return true;
}
cihazAktar(hash);
// Sayfa açıkken yalnız #cihaz= değişen link yeniden yükleme yapmaz: aktarıp yenile.
addEventListener("hashchange", () => { if (cihazAktar(new URLSearchParams(location.hash.slice(1)))) location.reload(); });
LS.cihaz();
if (q.get("oda")) odayaGir(q.get("oda")); else ciz();
})();
</script>
